name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: C++ unit tests
        run: npm run test:cpp
      - name: API tests (against the real engine)
        run: npm run test -w server

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck and build
        run: npm run build -w frontend
